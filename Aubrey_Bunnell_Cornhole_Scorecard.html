<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aubrey Bunnell - Cornhole Scorecard</title>
  <link rel="stylesheet" href="Aubrey_Bunnell_scorecards.css">
</head>
<body>
  <main class="page">
    <header>
      <p class="student-name">Aubrey Bunnell</p>
      <h1>Cornhole Scorecard</h1>
      <p>Backyard Team Match</p>
    </header>

    <section class="card">
      <table id="cornhole">
        <caption>Cornhole Scorecard</caption>
        <thead>
          <tr>
            <th scope="col">Team</th><th scope="col">Round 1</th><th scope="col">Round 2</th><th scope="col">Round 3</th><th scope="col">Round 4</th><th scope="col">Round 5</th><th scope="col">Total</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Team Sun</td><td>8</td><td>6</td><td>9</td><td>7</td><td>8</td><td>38</td></tr>
<tr><td>Team Moon</td><td>6</td><td>9</td><td>7</td><td>8</td><td>7</td><td>37</td></tr>
<tr><td>Team Star</td><td>7</td><td>8</td><td>6</td><td>9</td><td>9</td><td>39</td></tr>
<tr><td>Team Sky</td><td>9</td><td>7</td><td>8</td><td>6</td><td>8</td><td>38</td></tr>
        </tbody>
      </table>

      <p class="note">
        Scores are shown for each player or team and round.
      </p>
    </section>
  </main>
</body>
</html>
