<body>

          <tr><td>Aubrey</td><td>18</td><td>24</td><td>21</td><td>20</td><td>25</td><td>108</td></tr>
<tr><td>Sofia</td><td>16</td><td>20</td><td>18</td><td>23</td><td>22</td><td>99</td></tr>
<tr><td>Mason</td><td>21</td><td>19</td><td>24</td><td>20</td><td>18</td><td>102</td></tr>
<tr><td>Harper</td><td>17</td><td>22</td><td>20</td><td>19</td><td>23</td><td>101</td></tr>

      <p class="note">
        Scores are shown for each player or team and round.
      </p>
    </section>
  </main>
</body>
</html>
