<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aubrey Bunnell - Golf Scorecard</title>
  <link rel="stylesheet" href="Aubrey_Bunnell_scorecards.css?v=2">
</head>
<body>
  <main class="page">
    <header>
      <p class="student-name">Aubrey Bunnell</p>
      <h1>Golf Scorecard</h1>
      <p>Desert Ridge Five-Hole Match</p>
    </header>

    <section class="card">
      <table id="golf">
        <caption>Golf Scorecard</caption>
        <thead>
          <tr>
            <th scope="col">Player</th><th scope="col">Hole 1</th><th scope="col">Hole 2</th><th scope="col">Hole 3</th><th scope="col">Hole 4</th><th scope="col">Hole 5</th><th scope="col">Total</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Aubrey</td><td>4</td><td>5</td><td>4</td><td>3</td><td>5</td><td>21</td></tr>
<tr><td>Maya</td><td>5</td><td>4</td><td>5</td><td>4</td><td>4</td><td>22</td></tr>
<tr><td>Jordan</td><td>4</td><td>4</td><td>4</td><td>5</td><td>5</td><td>22</td></tr>
<tr><td>Noah</td><td>5</td><td>5</td><td>3</td><td>4</td><td>4</td><td>21</td></tr>
        </tbody>
      </table>

      <p class="note">
        Scores are shown for each player or team and round.
      </p>
    </section>
  </main>
</body>
</html>
